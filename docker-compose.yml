version: "3.9"

services:
  # =========================
  # Backend - Development
  # =========================
  backend-dev:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: taskboard-backend-dev
    volumes:
      - ./apps/backend/src:/app/src
      - ./apps/backend/tests:/app/tests
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app/src
      ENVIRONMENT: development
    command: uvicorn taskboard.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db

  # =========================
  # Backend - Production / Runtime
  # =========================
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: runtime
    container_name: taskboard-backend
    ports:
      - "8001:8000"
    environment:
      PYTHONPATH: /app/src
      ENVIRONMENT: production
    depends_on:
      - db

  # =========================
  # Frontend - Development
  # =========================
  frontend-dev:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: taskboard-frontend-dev
    volumes:
      - ./apps/frontend/src:/app/src
      - ./apps/frontend/public:/app/public
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
    command: npm start
    depends_on:
      - backend-dev

  # =========================
  # Frontend - Production / Runtime
  # =========================
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      target: build
    container_name: taskboard-frontend
    ports:
      - "80:80"
    environment:
      NODE_ENV: production
    depends_on:
      - backend

  # =========================
  # Database
  # =========================
  db:
    image: postgres:15
    container_name: taskboard-db
    environment:
      POSTGRES_USER: taskboard
      POSTGRES_PASSWORD: taskboard
      POSTGRES_DB: taskboard
    ports:
      - "5432:5432"
    volumes:
      - taskboard-db-data:/var/lib/postgresql/data

volumes:
  taskboard-db-data:

