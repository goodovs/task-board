name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: taskboard
          POSTGRES_PASSWORD: taskboard
          POSTGRES_DB: taskboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskboard -d taskboard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      # Install Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Build stage build
      - name: Build stage build
        run: docker build --target build -t taskboard-backend:ci ./apps/backend

      # Run tests
      - name: Run tests
        run: docker run --rm --network host taskboard-backend:ci pytest /app/tests

      # Build stage runtime for deploy
      - name: Build stage runtime
        run: docker build --target runtime -t taskboard-backend:prod ./apps/backend

